packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  sharp: true
  unrs-resolver: true

# These security overrides stay pinned until their direct parents adopt patched
# releases. minimatch 3 and 5 also need the reviewed CommonJS compatibility
# patches below because brace-expansion 5 exposes a named `expand` export.
overrides:
  "next@16.2.11>postcss": "8.5.18"
  "@tailwindcss/postcss@4.3.2>postcss": "8.5.18"
  "vite@8.1.4>postcss": "8.5.18"
  "@redocly/openapi-core@1.34.17>js-yaml": "4.3.0"
  "next@16.2.11>sharp": "0.35.0"
  "minimatch@3.1.5>brace-expansion": "5.0.8"
  "minimatch@5.1.9>brace-expansion": "5.0.8"
  "minimatch@10.2.5>brace-expansion": "5.0.8"

patchedDependencies:
  minimatch@3.1.5: patches/minimatch@3.1.5.patch
  minimatch@5.1.9: patches/minimatch@5.1.9.patch
